<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F1A14">
<title>ركشتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{
  --ink:#0F1A14;--ink2:#4F5B55;--ink3:#5B6660;--line:#E3E8E5;--bg:#F2F4F3;--card:#FFFFFF;
  --yellow:#FFC800;--yellow-soft:#FFF6D1;--green:#12B76A;--green-soft:#E7F8EF;--green-ink:#067647;
  --blue:#2E90FA;--red:#B42318;--red-soft:#FEF3F2;--star:#F5A300;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink)}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'opsz' 24;display:inline-block}
.f{font-variation-settings:'FILL' 1,'wght' 500,'opsz' 24}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:16px}
.topbar{padding:calc(var(--safe-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;background:var(--card);box-shadow:0 1px 0 var(--line)}
.topbar h1{margin:0;font-size:18px;font-weight:600;flex:1}
.h1{margin:0;font-size:26px;font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:12px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:none;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink)}
.icon-btn.float{background:var(--card);box-shadow:0 4px 16px rgba(15,26,20,.12)}
.icon-btn.dark{background:var(--ink);color:#fff}
.btn{height:56px;border-radius:18px;border:none;background:var(--ink);color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 18px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid #D7DDD9}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.danger{background:transparent;color:var(--red);height:46px}
.btn.sm{height:46px;font-size:14px;border-radius:14px}
.card{background:var(--card);border-radius:20px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.input{height:54px;border-radius:16px;border:1px solid #D7DDD9;background:#F7F8F8;padding:0 16px;font-size:16px;outline:none;width:100%}
.input:focus{border:2px solid var(--ink);background:#fff}
.avatar{width:46px;height:46px;border-radius:14px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.grey{background:#E3E8E5}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.pill.green{background:var(--green-soft);color:var(--green-ink)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.yellow{background:var(--yellow-soft);color:#7A5A00}
.pill.grey{background:#EEF1EF;color:var(--ink2)}
.chip{flex-shrink:0;height:38px;padding:0 14px;border-radius:999px;border:1px solid #D7DDD9;background:#fff;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{background:#E5E9E7;border-radius:14px;padding:4px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg button{height:38px;border:none;border-radius:10px;background:transparent;font-size:13px;color:#3E4A44}
.seg button.on{background:#fff;font-weight:600;color:var(--ink);box-shadow:0 1px 4px rgba(15,26,20,.08)}
.nav{background:var(--card);padding:8px 12px calc(var(--safe-bot) + 10px);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;box-shadow:0 -1px 0 var(--line);flex-shrink:0}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:6px 0}
.nav button .ic{padding:2px 16px;border-radius:999px}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on .ic{background:var(--yellow)}
.map{position:absolute;inset:0;z-index:0;background:#EDF1EE}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(15,26,20,.10);padding:10px 16px calc(var(--safe-bot) + 16px);display:flex;flex-direction:column;gap:12px;z-index:500;max-height:72%;overflow-y:auto}
.sheet>*{flex-shrink:0}
/* ما نخلي الأزرار والبطاقات تنضغط جوه القوائم الطويلة */
.btn,.card,.field,.input,.doc,.list-btn,.route-box,.stat,.driver-item,.chip,.seg,.actions3,.empty,textarea{flex-shrink:0}
.modal>*,.scroll>*{flex-shrink:0}
/* داخل الصفوف الأفقية، الزر العريض يتقلّص عشان ما يطلع برة الشاشة */
.row>.btn{flex-shrink:1;min-width:0}
.row>.btn[style*="width:"]{flex-shrink:0}
.sheet{transition:max-height .25s ease}
.sheet.collapsed{max-height:120px!important;overflow:hidden}
.grab-hit{border:none;background:none;padding:6px 40px 10px;margin:-6px auto -4px;display:flex;justify-content:center;cursor:grab;align-self:center}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:#C9D1CC;position:relative;flex-shrink:0;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:right .2s}
.switch:checked{background:var(--ink)}
.switch:checked::after{right:23px}
.switch:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.pill .ms{font-size:14px}
.grab{width:36px;height:4px;border-radius:4px;background:#D0D6D2;align-self:center;flex-shrink:0}
.map-top{position:absolute;top:calc(var(--safe-top) + 12px);left:16px;right:16px;display:flex;align-items:center;gap:10px;z-index:500}
.loc-box{flex:1;height:48px;border-radius:16px;background:#fff;box-shadow:0 4px 16px rgba(15,26,20,.10);display:flex;align-items:center;gap:8px;padding:0 14px;min-width:0}
.route-box{display:flex;align-items:stretch;gap:10px;background:#F4F6F5;border-radius:18px;padding:12px 14px}
.route-dots{display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:3px}
.dot-a{width:11px;height:11px;border-radius:50%;border:3px solid var(--blue)}
.dot-b{width:11px;height:11px;border-radius:3px;background:var(--ink)}
.dash{width:2px;flex:1;min-height:14px;background:repeating-linear-gradient(#B8C0BB 0 3px,transparent 3px 6px)}
.route-box input{border:none;background:transparent;outline:none;font-size:15px;font-weight:600;padding:0;width:100%}
.driver-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;border:1px solid var(--line);background:#fff;text-align:right;width:100%}
.driver-item.sel{border:2px solid var(--ink);background:#FFFCEB}
.rk{width:46px;height:46px;border-radius:14px;background:#F1F4F2;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rk.y{background:var(--yellow)}
.price{font-size:17px;font-weight:700}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:14px;border:1px solid #D7DDD9;background:#fff;display:flex;align-items:center;justify-content:center}
.progress{display:flex;gap:4px}.progress i{flex:1;height:4px;border-radius:4px;background:var(--line)}.progress i.on{background:var(--green)}
.plate{border:2px solid var(--ink);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.plate span:first-child{background:var(--ink);color:#fff;font-size:9px;width:100%;text-align:center;padding:1px 0}
.plate span:last-child{font-weight:700;font-size:15px;padding:2px 10px}
.actions3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.act{height:68px;border-radius:18px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;position:relative;text-decoration:none;color:var(--ink)}
.act.dark{background:var(--ink);color:#fff;border:none}
.badge{position:absolute;top:8px;left:10px;min-width:18px;height:18px;border-radius:9px;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bubble{max-width:78%;padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.55;word-break:break-word}
.bubble.me{align-self:flex-start;background:var(--ink);color:#fff;border-radius:20px 20px 20px 6px}
.bubble.them{align-self:flex-end;background:#fff;border-radius:20px 20px 6px 20px;box-shadow:0 2px 8px rgba(15,26,20,.06)}
.bubble .t{font-size:11px;opacity:.7;align-self:flex-end;display:flex;align-items:center;gap:3px}
.composer{background:#fff;padding:10px 12px calc(var(--safe-bot) + 12px);display:flex;align-items:center;gap:8px;box-shadow:0 -1px 0 var(--line)}
.composer input{flex:1;min-width:0;height:46px;border-radius:23px;border:1px solid var(--line);background:#F7F8F8;padding:0 16px;font-size:15px;outline:none}
.round{width:46px;height:46px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg)}
.round.y{background:var(--yellow)}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.stars{display:flex;gap:4px;direction:ltr;justify-content:center}
.stars button{border:none;background:none;padding:0;width:48px;height:48px}
.stars .ms{font-size:44px;color:#C9D1CC}
.stars .ms.on{color:#FFB800;font-variation-settings:'FILL' 1,'wght' 500,'opsz' 48}
.stat{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:19px}
.bars{height:120px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.bars div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{width:100%;border-radius:8px;background:rgba(255,200,0,.55);min-height:4px}
.bars span{font-size:10px;color:#A9B5AE}
.doc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;border:2px dashed #C9D1CC;background:#fff;text-align:right;width:100%;position:relative}
.doc.done{border:1px solid var(--line)}
.doc input{position:absolute;inset:0;opacity:0}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 24px;text-align:center;color:var(--ink2)}
.empty .ms{font-size:48px;color:#B8C0BB}
.toast{position:fixed;bottom:calc(var(--safe-bot) + 90px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;font-size:14px;opacity:0;transition:all .25s;z-index:9999;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--red)}.toast.success{background:var(--green-ink)}
.overlay{position:fixed;inset:0;background:rgba(15,26,20,.45);z-index:9000;display:flex;align-items:flex-end}
.modal{background:#fff;border-radius:28px 28px 0 0;width:100%;padding:20px 16px calc(var(--safe-bot) + 20px);display:flex;flex-direction:column;gap:14px;max-height:85%;overflow-y:auto}
.spinner{width:28px;height:28px;border:3px solid #E3E8E5;border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{width:84px;height:84px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;position:relative}
.pulse::before,.pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--yellow);animation:pulse 2s ease-out infinite;z-index:-1}
.pulse::after{animation-delay:1s}
@keyframes pulse{from{transform:scale(1);opacity:.6}to{transform:scale(2.2);opacity:0}}
.mk-rk{width:36px;height:36px;border-radius:50%;background:var(--yellow);border:3px solid #fff;box-shadow:0 4px 12px rgba(15,26,20,.3);display:flex;align-items:center;justify-content:center}
.mk-me{width:20px;height:20px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 0 0 10px rgba(46,144,250,.18)}
.mk-dest{width:16px;height:16px;border-radius:4px;background:var(--ink);border:3px solid #fff;box-shadow:0 2px 8px rgba(15,26,20,.4)}
.leaflet-control-attribution{font-size:9px!important;font-family:inherit}
.leaflet-container{font-family:inherit}
.hero{background:var(--yellow);padding:calc(var(--safe-top) + 56px) 24px 28px;position:relative;overflow:hidden}
.hero h1{margin:16px 0 0;font-size:32px;line-height:1.25;position:relative}
.hero p{margin:8px 0 0;color:#3A2F00;position:relative}
.logo{width:64px;height:64px;border-radius:20px;background:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(15,26,20,.25);position:relative}
.list-btn{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:none;border-radius:18px;width:100%;text-align:right;font-size:15px}
.timer{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.timer>div{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>

<script src="lib/leaflet.js"></script>
<script src="lib/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
